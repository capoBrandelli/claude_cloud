# Model Architecture Configuration

# Available model architectures
architectures:
  # Multi-Layer Perceptron
  mlp:
    enabled: true
    name: "Multi-Layer Perceptron"
    config:
      hidden_layers: [256, 128, 64, 32]
      activation: relu  # relu, gelu, silu, tanh
      dropout: 0.3
      batch_norm: true
      layer_norm: false

  # LSTM Network
  lstm:
    enabled: true
    name: "Long Short-Term Memory"
    config:
      hidden_size: 128
      num_layers: 2
      dropout: 0.2
      bidirectional: true
      sequence_length: 60  # Number of time steps
      attention: false  # Add attention mechanism

  # GRU Network
  gru:
    enabled: true
    name: "Gated Recurrent Unit"
    config:
      hidden_size: 128
      num_layers: 2
      dropout: 0.2
      bidirectional: true
      sequence_length: 60

  # 1D Convolutional Neural Network
  cnn:
    enabled: true
    name: "1D Convolutional Network"
    config:
      filters: [64, 128, 256]
      kernel_sizes: [3, 3, 3]
      pool_sizes: [2, 2, 2]
      dropout: 0.3
      batch_norm: true
      sequence_length: 60

  # Transformer
  transformer:
    enabled: true
    name: "Transformer"
    config:
      d_model: 128
      nhead: 8
      num_encoder_layers: 4
      dim_feedforward: 512
      dropout: 0.1
      sequence_length: 60

  # CNN-LSTM Hybrid
  cnn_lstm:
    enabled: true
    name: "CNN-LSTM Hybrid"
    config:
      # CNN part
      cnn_filters: [64, 128]
      cnn_kernel_sizes: [3, 3]
      cnn_pool_sizes: [2, 2]

      # LSTM part
      lstm_hidden_size: 128
      lstm_num_layers: 2
      lstm_bidirectional: true

      dropout: 0.2
      sequence_length: 60

  # Ensemble
  ensemble:
    enabled: true
    name: "Ensemble Model"
    config:
      models:
        - mlp
        - lstm
        - cnn
      aggregation: voting  # voting, averaging, stacking
      weights: null  # null for equal weights, or [0.3, 0.4, 0.3]

# Training configuration
training:
  # Task type
  task: classification  # classification or regression

  # Number of classes (for classification)
  num_classes: 5  # strong_bearish, weak_bearish, neutral, weak_bullish, strong_bullish

  # Batch size
  batch_size: 64

  # Number of epochs
  epochs: 100

  # Learning rate
  learning_rate: 0.001

  # Optimizer
  optimizer:
    type: adam  # adam, adamw, sgd, rmsprop
    weight_decay: 0.0001
    betas: [0.9, 0.999]

  # Loss function
  loss:
    type: cross_entropy  # cross_entropy, focal_loss, weighted_cross_entropy
    label_smoothing: 0.1
    class_weights: auto  # auto, balanced, or manual [1.0, 1.2, 1.0, 1.2, 1.0]

  # Learning rate scheduler
  lr_scheduler:
    type: reduce_on_plateau  # step, exponential, cosine, reduce_on_plateau
    patience: 5
    factor: 0.5
    min_lr: 1.0e-6
    mode: min  # min for loss, max for metrics

  # Gradient clipping
  gradient_clipping:
    enabled: true
    max_norm: 1.0

  # Mixed precision training
  mixed_precision:
    enabled: true

  # Data augmentation (for time series)
  augmentation:
    enabled: true
    techniques:
      - jitter  # Add random noise
      - scaling  # Random scaling
      - time_warp  # Time warping
    probability: 0.3

# Regularization
regularization:
  # L1/L2 regularization
  l1_lambda: 0.0
  l2_lambda: 0.0001

  # Dropout
  dropout: 0.3

  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001
    monitor: val_loss
    mode: min

# Validation strategy
validation:
  strategy: walk_forward  # k_fold, walk_forward, time_series_split
  n_splits: 5
  test_size: 0.2

# Hyperparameter optimization
hyperparameter_optimization:
  enabled: true
  method: optuna  # grid_search, random_search, optuna

  # Number of trials
  n_trials: 100

  # Search space
  search_space:
    learning_rate:
      type: log_uniform
      low: 1.0e-5
      high: 1.0e-2

    batch_size:
      type: categorical
      choices: [32, 64, 128]

    hidden_size:
      type: categorical
      choices: [64, 128, 256, 512]

    num_layers:
      type: int
      low: 1
      high: 4

    dropout:
      type: uniform
      low: 0.1
      high: 0.5

    activation:
      type: categorical
      choices: [relu, gelu, silu]

  # Optimization objective
  objective:
    metric: f1_score  # accuracy, f1_score, roc_auc
    direction: maximize  # maximize or minimize

  # Pruning
  pruning:
    enabled: true
    patience: 5

# Model checkpointing
checkpointing:
  enabled: true
  save_top_k: 3
  monitor: val_f1_score
  mode: max
  save_last: true
  save_freq: 1  # Save every N epochs

# Experiment tracking
experiment_tracking:
  enabled: true
  backend: mlflow  # mlflow, wandb, tensorboard
  experiment_name: tradeai_reversal_prediction
  run_name: null  # Auto-generated if null
  tags:
    project: tradeai
    task: reversal_prediction
  log_params: true
  log_metrics: true
  log_artifacts: true
  log_model: true
