# TradeAI Default Configuration

# Application settings
app:
  name: tradeai
  version: 0.1.0
  debug: false

# Data directories
paths:
  data_dir: data
  raw_data: data/raw
  processed_data: data/processed
  cache_dir: data/cache
  models_dir: models
  checkpoints_dir: models/checkpoints
  trained_models_dir: models/trained
  results_dir: results
  logs_dir: logs

# Logging configuration
logging:
  level: INFO
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  rotation: "100 MB"
  retention: "30 days"
  compression: "zip"

# Data collection settings
data_collection:
  max_retries: 3
  retry_delay: 2  # seconds
  timeout: 30  # seconds
  cache_enabled: true
  cache_ttl: 86400  # 24 hours in seconds
  validate_data: true
  consistency_check: true
  consistency_threshold: 0.01  # 1% tolerance for price differences

# Preprocessing settings
preprocessing:
  handle_missing: ffill  # forward fill, bfill, interpolate, drop
  remove_outliers: true
  outlier_method: iqr  # iqr, zscore
  outlier_threshold: 3
  normalize: true
  normalization_method: minmax  # minmax, zscore, robust

# Train/test split
split:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  shuffle: false  # Keep temporal order for time series

# Feature engineering
feature_engineering:
  enabled: true
  max_features: null  # null means no limit
  correlation_threshold: 0.85  # Remove features with correlation > 0.85
  variance_threshold: 0.01  # Remove features with variance < 0.01

# Labeling settings
labeling:
  method: zigzag  # zigzag, fractal, rolling_window
  zigzag_threshold: 0.05  # 5% threshold for reversal
  lookahead_window: 10  # bars to look ahead for reversal confirmation
  reversal_types:
    - strong_bullish  # Strong upward reversal
    - weak_bullish    # Weak upward reversal
    - neutral         # No clear reversal
    - weak_bearish    # Weak downward reversal
    - strong_bearish  # Strong downward reversal

# Model training
training:
  device: auto  # auto, cpu, cuda
  seed: 42
  deterministic: true
  benchmark: true
  num_workers: 4
  pin_memory: true

  # Early stopping
  early_stopping:
    enabled: true
    patience: 15
    min_delta: 0.001
    mode: min  # min for loss, max for accuracy

  # Checkpointing
  checkpointing:
    enabled: true
    save_top_k: 3
    monitor: val_loss
    mode: min

  # Learning rate scheduling
  lr_scheduler:
    enabled: true
    scheduler: reduce_on_plateau  # step, exponential, cosine, reduce_on_plateau
    patience: 5
    factor: 0.5
    min_lr: 1.0e-6

# Evaluation
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - confusion_matrix
  save_predictions: true
  save_plots: true

# Backtesting
backtesting:
  initial_capital: 100000
  currency: USD

  position_sizing:
    method: fixed_percent  # fixed_percent, kelly, volatility_target, equal_weight
    risk_per_trade: 0.02  # 2% risk per trade
    max_position_size: 0.1  # 10% max position size

  risk_management:
    max_positions: 10
    max_portfolio_risk: 0.20  # 20% max drawdown before stopping
    stop_loss_pct: 0.02  # 2% stop loss
    take_profit_pct: 0.04  # 4% take profit
    trailing_stop: true
    trailing_stop_pct: 0.015  # 1.5% trailing stop

  transaction_costs:
    commission_pct: 0.001  # 0.1% commission
    slippage_pct: 0.0005  # 0.05% slippage

  rebalancing:
    frequency: daily  # daily, weekly, monthly

  performance_metrics:
    - total_return
    - sharpe_ratio
    - sortino_ratio
    - max_drawdown
    - calmar_ratio
    - win_rate
    - profit_factor
    - avg_win
    - avg_loss
    - expectancy

# Experiment tracking
experiment_tracking:
  enabled: true
  backend: mlflow  # mlflow, wandb, tensorboard
  auto_log: true
  log_models: true
  log_artifacts: true
